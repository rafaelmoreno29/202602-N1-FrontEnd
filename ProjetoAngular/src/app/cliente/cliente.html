<p>Meu nome é {{ meuNome }}</p>
<input type="text" class="form-control" [(ngModel)]="meuNome" />
<button class="btn btn-success" (click)="adicionarCLiente()">
    Adicionar</button>
<p>Clicou {{ vezesClicou }} vezes</p>
<button class="btn btn-primary" (click)="clicar(1)">+1</button>
<button class="btn btn-danger" (click)="clicar(-1)">-1</button>

<!-- Exemplo de uso do ngIf ou @if -->
<div class="row">
    <div class="col-12">
        <input type="checkbox" [(ngModel)]="esconderTabela" id="esconderTabela" />
        <label for="esconderTabela">Esconder tabela</label>
    </div>
</div>
@if(!esconderTabela){
<div class="row">
    <div class="col-12">
        <input type="text" class="form-control" [(ngModel)]="pesquisa" placeholder="Pesquisar..." />
        <table class="table table-striped table-bordered table-hover">
            <thead>
                <tr>
                    <th>Código</th>
                    <th>Nome</th>
                    <th>Status</th>
                    <th>Ação</th>
                </tr>
            </thead>
            <tbody>
                @for (item of listaClientes; track $index) {
                <tr>
                    <td>{{item.id}}</td>
                    <td [ngStyle]="{'background-color': 
                    item.nome == pesquisa ? 'yellow' : 'transparent'}">{{item.nome}}</td>
                    <td [ngClass]="{'ativo': item.ativo, 'inativo': !item.ativo}">{{item.ativo ? 'Ativo' : 'Inativo'}}
                    </td>
                    <td>
                        @switch (item.ativo) {
                        @case (true) {
                        <button class="btn btn-sm btn-outline-danger" (click)="item.ativo = false">Inativar</button>
                        }
                        @case (false) {
                        <button class="btn btn-sm btn-outline-success" (click)="item.ativo = true">Ativar</button>
                        }
                        }
                        <button class="btn btn-sm btn-outline-primary"
                            [routerLink]="'/cliente-detalhe/' + item.id">Editar</button>
                    </td>
                </tr>
                }
            </tbody>
        </table>
    </div>
</div>
}
