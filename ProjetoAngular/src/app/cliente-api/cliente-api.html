<div class="row">
    <div class="col">
        <button class="btn btn-primary" (click)="open(content)">Adicionar</button>
    </div>
</div>
<div class="row">
    <div class="col">
        <table class="table table-striped table-bordered">
            <thead>
                <tr>
                    <th>Imagem</th>
                    <th>Id</th>
                    <th>Nome</th>
                    <th>E-mail</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                @for (item of clientes; track $index) {
                <tr>
                    <td style="width: 200px;">
                        <img [src]="item.imagem" class="img-thumbnail">
                    </td>
                    <td>{{ item.id }}</td>
                    <td>{{ item.nome }}</td>
                    <td>{{ item.email }}</td>
                    <td><button (click)="excluir(item.id)" class="btn btn-danger">
                            Excluir</button></td>
                </tr>
                }
            </tbody>
        </table>
    </div>
</div>

<ng-template #content let-modal>
    <div class="modal-header">
        <h4 class="modal-title" id="modal-basic-title">Inserir Cliente</h4>
        <button type="button" class="btn-close" aria-label="Close" (click)="modal.dismiss('Cross click')"></button>
    </div>
    <div class="modal-body">
        <form>
            <div class="mb-3">
                <label for="nome">Nome</label>
                <div class="input-group">
                    <input id="nome" class="form-control" placeholder="Nome" name="nome" />
                </div>
            </div>
            <div class="mb-3">
                <label for="email">E-mail</label>
                <div class="input-group">
                    <input id="email" class="form-control" placeholder="E-mail" name="email" />
                </div>
            </div>
            <div class="mb-3">
                <label for="imagem">Imagem</label>
                <div class="input-group">
                    <input id="imagem" class="form-control" placeholder="Imagem" name="imagem" />
                </div>
            </div>
        </form>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" (click)="modal.close('Save click')">Save</button>
    </div>
</ng-template>
