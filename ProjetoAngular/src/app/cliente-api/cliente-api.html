<div class="row">
    <div class="col">
        <button class="btn btn-primary">Adicionar</button>
    </div>
</div>
<div class="row">
    <div class="col">
        <table class="table table-striped table-bordered">
            <thead>
                <tr>
                    <th>Imagem</th>
                    <th>Id</th>
                    <th>Nome</th>
                    <th>E-mail</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                @for (item of clientes; track $index) {
                <tr>
                    <td style="width: 200px;">
                        <img [src]="item.imagem" class="img-thumbnail">
                    </td>
                    <td>{{ item.id }}</td>
                    <td>{{ item.nome }}</td>
                    <td>{{ item.email }}</td>
                    <td><button (click)="excluir(item.id)" class="btn btn-danger">
                            Excluir</button></td>
                </tr>
                }
            </tbody>
        </table>
    </div>
</div>
